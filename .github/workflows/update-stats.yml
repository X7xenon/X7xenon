name: Refresh Nothing Dot Telemetry SVGs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Nothing Dot SVGs
        run: |
          python .github/scripts/generate_svgs.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh Nothing dot telemetry SVGs" && git push)
